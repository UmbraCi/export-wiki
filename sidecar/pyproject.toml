[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-export-sidecar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "confluence-markdown-exporter==5.5.0+heytea.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pyinstaller>=6",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
# Built from local exporter sources with column metadata normalization and safe bold boundaries.
confluence-markdown-exporter = { path = "vendor/confluence_markdown_exporter-5.5.0+heytea.5-py3-none-any.whl" }
