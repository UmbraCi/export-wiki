[package]
name = "export-wiki"
version = "1.0.0"
description = "Tauri app for exporting Confluence Wiki content"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-connector = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
dev-connector = ["dep:tauri-plugin-connector"]

[dev-dependencies]
tempfile = "3.27.0"
